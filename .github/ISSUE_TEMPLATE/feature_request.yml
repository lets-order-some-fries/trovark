name: Feature request
description: A new signal, detector, or CLI capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you assess about an MCP server today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed signal or behavior
      description: Remember the project bar — findings must be facts (impossible-by-construction false positives), not verdicts about intent.
    validations:
      required: true
